version: "3.9"

services:
  codex-bridge:
    image: node:22-bookworm-slim
    working_dir: /opt/codex-bridge
    ports:
      - "4399:4399"
    environment:
      CODEX_BRIDGE_PORT: "4399"
      CODEX_RUNTIME_KIND: "app_server_adapter"
      CODEX_WORKSPACE_ROOT: "/workspace"
    volumes:
      - ./:/opt/codex-bridge
      - codex-workspace:/workspace
      - codex-home:/home/codex/.codex
    command: >
      bash -lc "npm install -g @openai/codex
      && node /opt/codex-bridge/server.mjs"

volumes:
  codex-workspace:
  codex-home:
