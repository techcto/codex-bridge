<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef1f6"/>
    </linearGradient>
    <style>
      .box { fill: #ffffff; stroke: #2d3436; stroke-width: 1.5; }
      .label { font: 14px sans-serif; fill: #2d3436; }
      .title { font: 16px sans-serif; font-weight: 600; fill: #2d3436; }
      .arrow { stroke: #0984e3; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0984e3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="360" fill="url(#bg)"/>

  <rect class="box" x="60" y="120" width="220" height="120" rx="10"/>
  <text class="title" x="80" y="150">CMS Platform</text>
  <text class="label" x="80" y="176">Auth, permissions</text>
  <text class="label" x="80" y="198">Context + apply</text>
  <text class="label" x="80" y="220">UI + storage</text>

  <rect class="box" x="370" y="90" width="220" height="180" rx="10"/>
  <text class="title" x="390" y="120">Codex Bridge</text>
  <text class="label" x="390" y="146">REST + SSE</text>
  <text class="label" x="390" y="168">Session routing</text>
  <text class="label" x="390" y="190">Runtime config</text>
  <text class="label" x="390" y="212">/v1 proxy</text>

  <rect class="box" x="680" y="120" width="220" height="120" rx="10"/>
  <text class="title" x="700" y="150">Codex Runtime</text>
  <text class="label" x="700" y="176">App server adapter</text>
  <text class="label" x="700" y="198">Provider access</text>
  <text class="label" x="700" y="220">Execution</text>

  <line class="arrow" x1="280" y1="180" x2="370" y2="180"/>
  <line class="arrow" x1="590" y1="180" x2="680" y2="180"/>
</svg>
